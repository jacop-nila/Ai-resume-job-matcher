<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Resume Job Matcher</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.header {
  background: linear-gradient(135deg,#2563eb,#4f46e5);
  color: white;
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 20px;
  box-shadow: 0 8px 25px #0002;
}

.header h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

.header p {
  margin: 0;
  opacity: .9;
}

.card {
  background: white;
  padding: 22px;
  margin: 18px 0;
  border-radius: 16px;
  box-shadow: 0 4px 18px #0001;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
}

input,
select,
textarea,
button {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border-radius: 10px;
  font-size: 16px;
}

input,
select,
textarea {
  border: 1px solid #cbd5e1;
  background: white;
}

textarea {
  min-height: 180px;
  resize: vertical;
}

button {
  border: none;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.file-name {
  font-size: 14px;
  color: #64748b;
}

.score-box {
  text-align: center;
  padding: 20px;
  background: #eff6ff;
  border-radius: 14px;
  margin-bottom: 20px;
}

.score {
  font-size: 52px;
  font-weight: bold;
  color: #2563eb;
}

.score-label {
  color: #475569;
}

.section {
  margin-top: 22px;
}

.skill {
  display: inline-block;
  padding: 8px 12px;
  margin: 5px;
  border-radius: 20px;
  font-size: 14px;
}

.matched {
  background: #dcfce7;
  color: #166534;
}

.missing {
  background: #fee2e2;
  color: #991b1b;
}

.evidence {
  background: #eff6ff;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.6;
}

.question {
  background: #f8fafc;
  padding: 12px;
  margin: 8px 0;
  border-left: 4px solid #2563eb;
  border-radius: 6px;
}

.bias {
  background: #ecfdf5;
  color: #166534;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.6;
}

.empty {
  color: #64748b;
  text-align: center;
  padding: 15px;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  padding: 20px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🤖 AI Resume-Job Matcher</h1>

<p>
Smart resume analysis for faster and fairer job matching
</p>

</div>


<div class="card">

<h2>📄 Resume</h2>

<label>Upload Resume</label>

<input
type="file"
id="resumeFile"
accept=".txt"
onchange="readFile()"
>

<div class="file-name" id="fileName">
No file selected
</div>


<label>Paste Resume</label>

<textarea
id="resumeText"
placeholder="Paste your resume here..."
></textarea>


<label>💼 Select Job Role</label>

<select id="job">

<option value="0">
Frontend Developer
</option>

<option value="1">
Python Developer
</option>

<option value="2">
Data Analyst
</option>

<option value="3">
Full Stack Developer
</option>

<option value="4">
Software Developer
</option>

</select>


<button onclick="checkMatch()">
🔍 Analyze Resume
</button>

</div>


<div class="card">

<h2>📊 Matching Report</h2>

<div id="result" class="empty">

Upload or paste a resume and click
"Analyze Resume".

</div>

</div>


<div class="footer">

AI Resume-Job Matcher • Hackathon Prototype

</div>

</div>


<script>

const jobs = [

{
name: "Frontend Developer",
skills: [
"html",
"css",
"javascript",
"react",
"git"
]
},

{
name: "Python Developer",
skills: [
"python",
"sql",
"git",
"machine learning"
]
},

{
name: "Data Analyst",
skills: [
"python",
"sql",
"data analysis",
"excel",
"communication"
]
},

{
name: "Full Stack Developer",
skills: [
"html",
"css",
"javascript",
"react",
"node.js",
"sql",
"git"
]
},

{
name: "Software Developer",
skills: [
"python",
"java",
"sql",
"git",
"problem solving"
]
}

];


function readFile() {

const file =
document.getElementById("resumeFile")
.files[0];

if (!file) {
return;
}

document.getElementById("fileName")
.innerText =
"Selected: " + file.name;

const reader = new FileReader();

reader.onload = function(event) {

document.getElementById("resumeText")
.value = event.target.result;

};

reader.readAsText(file);

}


function checkMatch() {

const resume =
document.getElementById("resumeText")
.value
.toLowerCase();

const jobIndex =
document.getElementById("job")
.value;

const job =
jobs[jobIndex];


if (!resume.trim()) {

alert(
"Please upload or paste a resume first."
);

return;

}


let matched = [];

let missing = [];


job.skills.forEach(function(skill) {

if (resume.includes(skill)) {

matched.push(skill);

} else {

missing.push(skill);

}

});


const score =
Math.round(
(matched.length / job.skills.length) * 100
);


let output = "";


output += `

<div class="score-box">

<div class="score">
${score}%
</div>

<div class="score-label">
Overall Job Match
</div>

</div>

<h3>💼 Job Role</h3>

<p>
<b>${job.name}</b>
</p>

`;


output += `

<div class="section">

<h3>✅ Matched Skills</h3>

`;


if (matched.length > 0) {

matched.forEach(function(skill) {

output += `

<span class="skill matched">
✓ ${skill}
</span>

`;

});

} else {

output +=
"<p>No matching skills detected.</p>";

}


output += "</div>";


output += `

<div class="section">

<h3>❌ Skill Gaps</h3>

`;


if (missing.length > 0) {

missing.forEach(function(skill) {

output += `

<span class="skill missing">
✗ ${skill}
</span>

`;

});

} else {

output +=
"<p>No major skill gaps detected.</p>";

}


output += "</div>";


output += `

<div class="section">

<h3>🔎 Resume Evidence</h3>

<div class="evidence">

The resume contains evidence related to:

<br><br>

<b>
${matched.join(", ") || "No matching skills"}
</b>

</div>

</div>

`;


output += `

<div class="section">

<h3>🎤 Suggested Interview Questions</h3>

`;


if (missing.length > 0) {

missing.forEach(function(skill) {

output += `

<div class="question">

Explain your experience with
<b>${skill}</b>.

</div>

`;

});

} else {

output += `

<div class="question">
Tell us about your strongest project.
</div>

<div class="question">
How did you solve a difficult technical problem?
</div>

<div class="question">
How do you work effectively with a team?
</div>

`;

}


output += "</div>";


output += `

<div class="section">

<h3>🛡️ Bias Check</h3>

<div class="bias">

✓ Matching focuses on job-related
skills and evidence.

<br><br>

✓ Protected attributes such as age,
gender, religion and race are not
used for the match score.

</div>

</div>

`;


document.getElementById("result")
.innerHTML = output;

}


if ("serviceWorker" in navigator) {

navigator.serviceWorker.register("./sw.js")
.then(function() {

console.log(
"Service Worker registered"
);

})
.catch(function(error) {

console.log(
"Service Worker error:",
error
);

});

}

</script>

</body>

  </html>
